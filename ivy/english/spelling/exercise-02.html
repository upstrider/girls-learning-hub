<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ivy-Rose • Spelling Exercise 2</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at 10% 10%, #fff1f7 0, transparent 28%),
    radial-gradient(circle at 90% 20%, #eaf4ff 0, transparent 28%),
    radial-gradient(circle at 50% 95%, #fff7d9 0, transparent 30%),
    #f8f9fd;
  color: #172033;
  min-height: 100vh;
}

.topbar {
  max-width: 850px;
  margin: auto;
  padding: 24px 22px 5px;
}

.back {
  color: #66718a;
  text-decoration: none;
  font-weight: 800;
  font-size: 14px;
}

.wrapper {
  max-width: 760px;
  margin: 0 auto;
  padding: 20px 20px 60px;
}

.heading {
  text-align: center;
  margin-bottom: 22px;
}

.heading .eyebrow {
  color: #7a85a0;
  font-size: 14px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.heading h1 {
  margin: 7px 0 5px;
  font-size: 34px;
}

.heading p {
  color: #7c869c;
  margin: 0;
}

.progress-area {
  margin: 25px 0 18px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  font-weight: 800;
  font-size: 14px;
  margin-bottom: 9px;
}

.progress-track {
  height: 12px;
  background: #e9edf5;
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 10%;
  border-radius: 99px;
  background: linear-gradient(90deg, #6fa8ff, #8c7cff);
  transition: width .4s ease;
}

.card {
  background: rgba(255,255,255,.96);
  border-radius: 30px;
  padding: 32px;
  box-shadow: 0 16px 45px rgba(42,55,90,.10);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.stars {
  position: absolute;
  font-size: 22px;
  opacity: .75;
}

.star1 { top: 20px; left: 25px; }
.star2 { top: 28px; right: 27px; }

.picture {
  width: 190px;
  height: 150px;
  margin: 5px auto 18px;
  border-radius: 25px;
  background: linear-gradient(145deg, #f1f7ff, #fff0f6);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 82px;
}

.word-number {
  display: inline-block;
  padding: 7px 13px;
  background: #eef4ff;
  color: #3975d9;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .5px;
  margin-bottom: 12px;
}

.instruction {
  font-size: 19px;
  font-weight: 800;
  margin: 4px 0 18px;
}

.listen-button {
  border: none;
  background: linear-gradient(135deg, #407fe5, #716ee8);
  color: white;
  border-radius: 18px;
  padding: 16px 26px;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(62,111,220,.25);
}

.hint {
  color: #9099aa;
  font-size: 13px;
  margin: 13px 0 20px;
}

.answer {
  width: 100%;
  max-width: 440px;
  display: block;
  margin: 0 auto;
  padding: 17px 18px;
  border: 2px solid #e2e7f0;
  border-radius: 16px;
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  outline: none;
}

.answer:focus {
  border-color: #75a5f5;
  box-shadow: 0 0 0 4px #edf4ff;
}

.check-button {
  margin-top: 16px;
  border: none;
  background: #182033;
  color: white;
  padding: 15px 30px;
  border-radius: 15px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}

.feedback {
  min-height: 54px;
  margin-top: 17px;
  font-size: 18px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}

.correct { color: #15915c; }
.wrong { color: #e0526e; }

.next-button {
  display: none;
  margin: 3px auto 0;
  border: none;
  background: #19a66a;
  color: white;
  padding: 15px 28px;
  border-radius: 15px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}

.result {
  display: none;
  text-align: center;
}

.trophy {
  font-size: 100px;
}

.result h1 {
  font-size: 36px;
}

.big-score {
  font-size: 55px;
  font-weight: 900;
  margin: 18px 0 4px;
}

.result-message {
  color: #6f7990;
  font-size: 18px;
  margin-bottom: 25px;
}

.result-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

.result-button {
  text-decoration: none;
  border: none;
  padding: 14px 20px;
  border-radius: 14px;
  font-weight: 900;
  cursor: pointer;
  font-size: 15px;
}

.retry {
  background: #eef2f8;
  color: #27334b;
}

.finish {
  background: #397be0;
  color: white;
}

.confetti {
  position: fixed;
  top: -20px;
  pointer-events: none;
  z-index: 9999;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: .9;
  }
}

@media (max-width: 600px) {
  .card { padding: 25px 18px; }
  .heading h1 { font-size: 29px; }

  .picture {
    width: 160px;
    height: 130px;
    font-size: 70px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <a class="back" href="../../../../index.html">
    ← BACK TO SPELLING
  </a>
</div>

<div class="wrapper">

<div id="exerciseScreen">

  <div class="heading">
    <div class="eyebrow">Ivy-Rose • Grade 2</div>
    <h1>✨ Spelling Challenge ✨</h1>
    <p>Exercise 2 • Words 11–20</p>
  </div>

  <div class="progress-area">

    <div class="progress-info">
      <span id="progressText">Word 1 of 10</span>
      <span>⭐ <span id="score">0</span></span>
    </div>

    <div class="progress-track">
      <div id="progressBar" class="progress-bar"></div>
    </div>

  </div>

  <div class="card">

    <span class="stars star1">✨</span>
    <span class="stars star2">⭐</span>

    <div id="picture" class="picture">🎧</div>

    <div id="wordNumber" class="word-number">
      WORD 1
    </div>

    <div class="instruction">
      Listen carefully. What word do you hear?
    </div>

    <button class="listen-button" onclick="speakWord()">
      🔊 HEAR THE WORD
    </button>

    <div class="hint">
      You can listen as many times as you need.
    </div>

    <input
      id="answer"
      class="answer"
      type="text"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Type the word..."
    >

    <button id="checkButton"
            class="check-button"
            onclick="checkAnswer()">
      CHECK ✓
    </button>

    <div id="feedback" class="feedback"></div>

    <button id="nextButton"
            class="next-button"
            onclick="nextWord()">
      NEXT WORD →
    </button>

  </div>

</div>


<div id="resultScreen" class="card result">

  <div id="trophy" class="trophy">🏆</div>

  <h1 id="resultTitle">
    Brilliant work!
  </h1>

  <div id="starsResult" style="font-size:34px;">
    ⭐⭐⭐
  </div>

  <div id="finalScore" class="big-score">
    10 / 10
  </div>

  <div id="resultMessage" class="result-message"></div>

  <div class="result-buttons">

    <button class="result-button retry"
            onclick="restartExercise()">
      ↻ TRY AGAIN
    </button>

    <a class="result-button finish"
       href="../../../../index.html">
      FINISH ✓
    </a>

  </div>

</div>

</div>


<script>

/* EXERCISE 2 — WORDS 11–20 */

const words = [
  {
    word: "because",
    reveal: "💬"
  },
  {
    word: "children",
    reveal: "👧🧒"
  },
  {
    word: "library",
    reveal: "📚"
  },
  {
    word: "apple",
    reveal: "🍎"
  },
  {
    word: "neighbour",
    reveal: "🏡"
  },
  {
    word: "jumping",
    reveal: "🤸"
  },
  {
    word: "butterfly",
    reveal: "🦋"
  },
  {
    word: "kitchen",
    reveal: "🍳"
  },
  {
    word: "friend",
    reveal: "👭"
  },
  {
    word: "strawberry",
    reveal: "🍓"
  }
];

let current = 0;
let score = 0;
let answeredCorrectly = false;


/* BRITISH FEMALE VOICE */

function getBritishVoice() {

  const voices = speechSynthesis.getVoices();

  const britishVoices = voices.filter(v =>
    v.lang &&
    v.lang.toLowerCase().startsWith("en-gb")
  );

  const preferredNames = [
    "Serena",
    "Kate",
    "Stephanie",
    "Samantha",
    "Martha",
    "Hazel",
    "Google UK English Female"
  ];

  for (const name of preferredNames) {

    const voice = britishVoices.find(v =>
      v.name.toLowerCase().includes(name.toLowerCase())
    );

    if (voice) return voice;
  }

  return britishVoices[0] || voices[0];
}


function speakWord() {

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(words[current].word);

  const voice = getBritishVoice();

  if (voice) {
    utterance.voice = voice;
  }

  utterance.lang = "en-GB";
  utterance.rate = 0.82;
  utterance.pitch = 1.08;
  utterance.volume = 1;

  speechSynthesis.speak(utterance);
}


speechSynthesis.onvoiceschanged = function() {
  speechSynthesis.getVoices();
};


/* CHECK ANSWER */

function checkAnswer() {

  const input =
    document.getElementById("answer");

  const feedback =
    document.getElementById("feedback");

  const answer =
    input.value.trim().toLowerCase();

  if (!answer) {

    feedback.className = "feedback wrong";
    feedback.textContent =
      "Type the word first 😊";

    return;
  }


  if (answer === words[current].word) {

    if (!answeredCorrectly) {
      score++;
      answeredCorrectly = true;
    }

    document.getElementById("score")
      .textContent = score;

    document.getElementById("picture")
      .textContent = words[current].reveal;

    feedback.className = "feedback correct";

    feedback.textContent =
      "✨ Brilliant! That's correct!";

    input.disabled = true;

    document.getElementById("checkButton")
      .style.display = "none";

    document.getElementById("nextButton")
      .style.display = "block";

  }

  else {

    feedback.className = "feedback wrong";

    feedback.textContent =
      "Almost! Listen again and try once more 💛";

    input.select();
  }
}


/* NEXT WORD */

function nextWord() {

  current++;

  if (current >= words.length) {

    finishExercise();
    return;
  }

  answeredCorrectly = false;

  const input =
    document.getElementById("answer");

  input.disabled = false;
  input.value = "";

  document.getElementById("picture")
    .textContent = "🎧";

  document.getElementById("feedback")
    .textContent = "";

  document.getElementById("checkButton")
    .style.display = "inline-block";

  document.getElementById("nextButton")
    .style.display = "none";

  updateProgress();

  input.focus();
}


/* PROGRESS */

function updateProgress() {

  document.getElementById("progressText")
    .textContent =
      `Word ${current + 1} of ${words.length}`;

  document.getElementById("wordNumber")
    .textContent =
      `WORD ${current + 1}`;

  document.getElementById("progressBar")
    .style.width =
      `${((current + 1) / words.length) * 100}%`;
}


/* FINISH */

function finishExercise() {

  document.getElementById("exerciseScreen")
    .style.display = "none";

  document.getElementById("resultScreen")
    .style.display = "block";

  document.getElementById("finalScore")
    .textContent =
      `${score} / ${words.length}`;

  const passed = score >= 8;


  if (passed) {

    document.getElementById("resultTitle")
      .textContent = "You passed! 🎉";

    document.getElementById("trophy")
      .textContent = "🏆";

    document.getElementById("resultMessage")
      .textContent =
        "Amazing spelling, Ivy-Rose!";

    if (score === 10) {

      document.getElementById("starsResult")
        .textContent = "⭐⭐⭐";

    } else {

      document.getElementById("starsResult")
        .textContent = "⭐⭐";

    }


    /* SAVE EXERCISE #2 PASS */

    localStorage.setItem(
      "ivy-english-spelling-exercise-02",
      JSON.stringify({
        passed: true,
        score: score,
        total: words.length
      })
    );

    makeConfetti();

  }

  else {

    document.getElementById("resultTitle")
      .textContent = "Good practice! 💛";

    document.getElementById("trophy")
      .textContent = "🌟";

    document.getElementById("starsResult")
      .textContent = "⭐";

    document.getElementById("resultMessage")
      .textContent =
        "Let's practise those tricky words and try again!";
  }
}


/* RESTART */

function restartExercise() {

  current = 0;
  score = 0;
  answeredCorrectly = false;

  document.getElementById("score")
    .textContent = "0";

  document.getElementById("resultScreen")
    .style.display = "none";

  document.getElementById("exerciseScreen")
    .style.display = "block";

  const input =
    document.getElementById("answer");

  input.disabled = false;
  input.value = "";

  document.getElementById("picture")
    .textContent = "🎧";

  document.getElementById("feedback")
    .textContent = "";

  document.getElementById("checkButton")
    .style.display = "inline-block";

  document.getElementById("nextButton")
    .style.display = "none";

  updateProgress();
}


/* CONFETTI */

function makeConfetti() {

  const pieces = [
    "⭐",
    "✨",
    "🌸",
    "💖",
    "🎉"
  ];

  for (let i = 0; i < 35; i++) {

    const confetti =
      document.createElement("div");

    confetti.className = "confetti";

    confetti.textContent =
      pieces[Math.floor(Math.random() * pieces.length)];

    confetti.style.left =
      Math.random() * 100 + "vw";

    confetti.style.fontSize =
      (14 + Math.random() * 18) + "px";

    confetti.style.animationDuration =
      (2.5 + Math.random() * 2) + "s";

    confetti.style.animationDelay =
      (Math.random() * .7) + "s";

    document.body.appendChild(confetti);

    setTimeout(() => {
      confetti.remove();
    }, 5000);
  }
}


/* ENTER KEY */

document.getElementById("answer")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      const nextVisible =
        document.getElementById("nextButton")
        .style.display === "block";

      if (nextVisible) {
        nextWord();
      } else {
        checkAnswer();
      }
    }
  });


updateProgress();

</script>

</body>
</html>
