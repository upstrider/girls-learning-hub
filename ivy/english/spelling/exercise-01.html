<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivy-Rose Spelling Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 700px;
      background: white;
      border-radius: 26px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 28px;
    }

    .small {
      color: #7a8497;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
    }

    h1 {
      margin: 5px 0 0;
      font-size: 26px;
    }

    .score {
      font-weight: bold;
      background: #f1f3f7;
      padding: 10px 16px;
      border-radius: 50px;
      white-space: nowrap;
    }

    .main {
      text-align: center;
    }

    .speaker {
      font-size: 60px;
      margin-top: 15px;
    }

    .hear-button {
      width: 100%;
      max-width: 420px;
      margin: 20px auto 10px;
      padding: 20px;
      border: 0;
      border-radius: 18px;
      background: #3478df;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .hear-button:active {
      transform: scale(0.98);
    }

    .instruction {
      color: #667085;
      margin: 15px 0 25px;
      font-size: 16px;
    }

    input {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: auto;
      padding: 18px;
      border: 2px solid #dfe3eb;
      border-radius: 16px;
      font-size: 26px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #3478df;
    }

    .check-button,
    .next-button,
    .restart-button {
      width: 100%;
      max-width: 420px;
      margin: 14px auto 0;
      padding: 17px;
      border: 0;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .check-button {
      background: #172033;
      color: white;
    }

    .next-button {
      background: #20a46b;
      color: white;
    }

    .feedback {
      min-height: 65px;
      margin-top: 22px;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .correct {
      color: #15945e;
    }

    .wrong {
      color: #e34b4b;
    }

    .hidden {
      display: none;
    }

    .results {
      text-align: center;
    }

    .trophy {
      font-size: 72px;
    }

    .results h2 {
      font-size: 38px;
      margin: 10px 0;
    }

    .final-score {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .mistakes {
      margin: 25px auto;
      max-width: 440px;
      background: #f5f7fb;
      padding: 20px;
      border-radius: 18px;
      text-align: left;
    }

    .mistakes h3 {
      margin-top: 0;
    }

    .mistakes p {
      margin: 8px 0;
    }

    .restart-button {
      background: #3478df;
      color: white;
    }

    @media (max-width: 600px) {
      .app {
        padding: 22px 18px;
        border-radius: 20px;
      }

      .top {
        align-items: flex-start;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div id="testScreen">

      <div class="top">
        <div>
          <div class="small">IVY-ROSE • GRADE 2</div>
          <h1 id="progress">Word 1 of 10</h1>
        </div>

        <div class="score" id="score">Score: 0</div>
      </div>

      <div class="main">

        <div class="speaker">🔊</div>

        <button class="hear-button" id="hearButton">
          HEAR THE WORD
        </button>

        <div class="instruction">
          Listen carefully, then type the word you hear.
          <br>
          You can listen as many times as you need.
        </div>

        <input
          id="answer"
          type="text"
          placeholder="Type the word..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />

        <button class="check-button" id="checkButton">
          CHECK ✓
        </button>

        <div class="feedback" id="feedback"></div>

        <button class="next-button hidden" id="nextButton">
          NEXT WORD →
        </button>

      </div>
    </div>


    <div class="results hidden" id="resultsScreen">

      <div class="trophy" id="resultEmoji">🏆</div>

      <h2 id="resultTitle">PASSED!</h2>

      <div class="final-score" id="finalScore"></div>

      <p id="resultText"></p>

      <div class="mistakes hidden" id="mistakesBox">
        <h3>Words to practise:</h3>
        <div id="mistakesList"></div>
      </div>

      <button class="restart-button" id="restartButton">
        TAKE THE TEST AGAIN
      </button>

    </div>

  </div>


<script>

const words = [
  "beautiful",
  "garden",
  "school",
  "elephant",
  "morning",
  "pencil",
  "rabbit",
  "surprise",
  "window",
  "flower"
];

let current = 0;
let score = 0;
let answered = false;
let mistakes = [];


const progress = document.getElementById("progress");
const scoreDisplay = document.getElementById("score");
const hearButton = document.getElementById("hearButton");
const answerInput = document.getElementById("answer");
const checkButton = document.getElementById("checkButton");
const nextButton = document.getElementById("nextButton");
const feedback = document.getElementById("feedback");

const testScreen = document.getElementById("testScreen");
const resultsScreen = document.getElementById("resultsScreen");

const resultEmoji = document.getElementById("resultEmoji");
const resultTitle = document.getElementById("resultTitle");
const finalScore = document.getElementById("finalScore");
const resultText = document.getElementById("resultText");

const mistakesBox = document.getElementById("mistakesBox");
const mistakesList = document.getElementById("mistakesList");

const restartButton = document.getElementById("restartButton");


function speakWord() {

  window.speechSynthesis.cancel();

  const word = words[current];

  const speech = new SpeechSynthesisUtterance(word);

  speech.lang = "en-GB";
  speech.rate = 0.75;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}


hearButton.addEventListener("click", speakWord);


checkButton.addEventListener("click", checkAnswer);

answerInput.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    event.preventDefault();

    if (!answered) {
      checkAnswer();
    }
  }

});


function checkAnswer() {

  if (answered) return;

  const typed = answerInput.value.trim().toLowerCase();

  if (!typed) {
    feedback.textContent = "Type your answer first 😊";
    return;
  }

  answered = true;

  const correctWord = words[current];

  if (typed === correctWord) {

    score++;

    feedback.innerHTML =
      '<span class="correct">⭐ CORRECT! Well done!</span>';

  } else {

    mistakes.push({
      typed: typed,
      correct: correctWord
    });

    feedback.innerHTML =
      '<span class="wrong">Not quite 💪<br>The correct spelling is: <strong>' +
      correctWord +
      '</strong></span>';
  }

  scoreDisplay.textContent = "Score: " + score;

  answerInput.disabled = true;
  checkButton.classList.add("hidden");

  nextButton.classList.remove("hidden");

  if (current === words.length - 1) {
    nextButton.textContent = "SEE MY RESULT →";
  }

}


nextButton.addEventListener("click", function() {

  if (current < words.length - 1) {

    current++;

    loadQuestion();

  } else {

    showResults();

  }

});


function loadQuestion() {

  answered = false;

  progress.textContent =
    "Word " + (current + 1) + " of " + words.length;

  answerInput.value = "";
  answerInput.disabled = false;

  feedback.textContent = "";

  checkButton.classList.remove("hidden");
  nextButton.classList.add("hidden");

  nextButton.textContent = "NEXT WORD →";

  answerInput.focus();

}


function showResults() {

  testScreen.classList.add("hidden");
  resultsScreen.classList.remove("hidden");

  const percentage = Math.round(
    (score / words.length) * 100
  );

  finalScore.textContent =
    score + " / 10 — " + percentage + "%";

  if (score >= 8) {

    resultEmoji.textContent = "🏆";
    resultTitle.textContent = "PASSED!";

    resultText.textContent =
      "Fantastic work, Ivy-Rose! You passed your spelling test!";

  } else {

    resultEmoji.textContent = "🌟";
    resultTitle.textContent = "KEEP PRACTISING!";

    resultText.textContent =
      "Good effort, Ivy-Rose. Practise the tricky words and try again.";

  }


  if (mistakes.length > 0) {

    mistakesBox.classList.remove("hidden");

    mistakesList.innerHTML = "";

    mistakes.forEach(function(item) {

      const row = document.createElement("p");

      row.innerHTML =
        "You wrote <strong>" +
        item.typed +
        "</strong> → <strong>" +
        item.correct +
        "</strong>";

      mistakesList.appendChild(row);

    });

  } else {

    mistakesBox.classList.remove("hidden");

    mistakesList.innerHTML =
      "<p><strong>🌟 PERFECT SCORE — 10/10! 🌟</strong></p>";

  }

}


restartButton.addEventListener("click", function() {

  current = 0;
  score = 0;
  answered = false;
  mistakes = [];

  scoreDisplay.textContent = "Score: 0";

  mistakesBox.classList.add("hidden");

  resultsScreen.classList.add("hidden");
  testScreen.classList.remove("hidden");

  loadQuestion();

});


loadQuestion();

</script>

</body>
</html>
